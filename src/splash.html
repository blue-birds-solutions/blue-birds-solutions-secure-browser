<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Secure Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0c0e14;
      border: 1px solid #1f2533;
      border-top: 2px solid #3b82f6;
      border-radius: 12px;
      padding: 36px 32px;
      position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      text-align: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 10.5px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-bottom: 26px;
    }

    .loader-container {
      width: 200px;
      position: relative;
      margin-bottom: 14px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 2px;
      background: #1e2433;
      border-radius: 1px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 40%;
      background: #3b82f6;
      position: absolute;
      border-radius: 1px;
      animation: loading-bar 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loading-bar {
      0% {
        left: -40%;
      }
      100% {
        left: 100%;
      }
    }

    .status-text {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #64748b;
      height: 14px;
      transition: opacity 0.2s ease;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="logo-container">
        <img class="logo-img" src="./desktop_icon.png" alt="Bluebirds Secure Browser" />
      </div>

      <h1 class="brand-title">Bluebirds Solutions</h1>
      <div class="brand-subtitle">Secure Browser <span id="version-label"></span></div>

      <div class="loader-container">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill"></div>
        </div>
      </div>

      <div class="status-text" id="status">Initializing secure environment...</div>
    </div>
  </div>

  <script>
    const versionLabel = document.getElementById('version-label');
    const version = window.location.hash.substring(1);
    if (version) {
      versionLabel.textContent = 'v' + version;
    }

    const statuses = [
      "Verifying system integrity...",
      "Validating display topology...",
      "Auditing active processes...",
      "Connecting to assessment gateway...",
      "Synchronizing diagnostic policies..."
    ];
    let currentIndex = 0;
    const statusEl = document.getElementById('status');

    setInterval(() => {
      currentIndex = (currentIndex + 1) % statuses.length;
      statusEl.style.opacity = 0;
      setTimeout(() => {
        statusEl.textContent = statuses[currentIndex];
        statusEl.style.opacity = 1;
      }, 150);
    }, 1100);
  </script>
</body>
</html>
