<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluebirds Secure Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color: #0f172a;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px 28px;
      position: relative;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.04);
    }

    /* Top Brand & Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(37, 99, 235, 0.25));
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0f172a;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #64748b;
      transition: all 0.3s ease;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #94a3b8;
      transition: all 0.3s ease;
    }

    .badge.updating {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #2563eb;
    }
    .badge.updating .badge-dot {
      background: #3b82f6;
      box-shadow: 0 0 8px #3b82f6;
      animation: pulse-dot 1.5s infinite;
    }

    .badge.complete {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #059669;
    }
    .badge.complete .badge-dot {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #splash-exit-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 24px;
      padding: 0 10px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: inherit;
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }

    #splash-exit-btn:hover {
      background: #dc2626;
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
    }

    #splash-exit-btn:active {
      transform: scale(0.96);
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Main Center Content */
    .center-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
      margin-bottom: 6px;
    }

    .status-header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .status-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    .percent-readout {
      font-size: 13px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #2563eb;
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: #f1f5f9;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      border: 1px solid #e2e8f0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 9999px;
      transition: width 0.22s ease-out;
      position: relative;
    }

    .progress-bar-fill.indeterminate {
      width: 35%;
      position: absolute;
      animation: indeterminate-scan 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes indeterminate-scan {
      0% { left: -35%; }
      100% { left: 100%; }
    }

    /* Enterprise Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .metric-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .metric-label {
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .metric-value {
      font-size: 11.5px;
      font-weight: 600;
      color: #0f172a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Footer Narrative */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #f1f5f9;
      padding-top: 10px;
    }

    .status-narrative {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    .security-tag {
      font-size: 9.5px;
      color: #475569;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="brand-group">
        <img class="logo-img" src="../desktop_icon.png" onerror="this.onerror=null; this.src='./desktop_icon.png';" alt="Bluebirds Secure Browser" />
        <div class="brand-titles">
          <div class="brand-title">Bluebirds Solutions</div>
          <div class="brand-subtitle">Secure Exam Browser <span id="current-version-label"></span></div>
        </div>
      </div>
      <div class="header-actions">
        <div class="badge" id="status-badge">
          <span class="badge-dot" id="badge-dot"></span>
          <span id="badge-text">INITIALIZING</span>
        </div>
        <button id="splash-exit-btn" title="Cancel startup and exit application (Cmd+L)">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Exit
        </button>
      </div>
    </div>

    <!-- Center Section -->
    <div class="center-section">
      <div class="status-header-row">
        <div class="status-title" id="status-title">Initializing secure lockdown environment...</div>
        <div class="percent-readout" id="percent-readout"></div>
      </div>

      <div class="progress-track">
        <div class="progress-bar-fill indeterminate" id="progress-bar"></div>
      </div>

      <!-- Enterprise 3-Column Metrics Grid -->
      <div class="metrics-grid">
        <div class="metric-col">
          <span class="metric-label" id="metric-label-1">Network Speed</span>
          <span class="metric-value" id="metric-val-1">Auditing...</span>
        </div>
        <div class="metric-col">
          <span class="metric-label" id="metric-label-2">Transferred</span>
          <span class="metric-value" id="metric-val-2">Verifying</span>
        </div>
        <div class="metric-col">
          <span class="metric-label" id="metric-label-3">Estimated Time</span>
          <span class="metric-value" id="metric-val-3">Standby</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="status-narrative" id="status-narrative">
        Verifying system integrity and diagnostic policies...
      </div>
      <div class="security-tag" id="security-tag">
        TLS 1.3 • Cloudflare Edge
      </div>
    </div>
  </div>

  <script>
    // Initialize version from URL hash
    const versionLabel = document.getElementById('current-version-label');
    const version = window.location.hash.substring(1);
    if (version) {
      versionLabel.textContent = 'v' + version;
    }

    let ipcRenderer;
    try {
      if (typeof require === 'function') {
        ipcRenderer = require('electron').ipcRenderer;
      }
    } catch (err) {
      console.warn('[Splash] Direct node require unavailable:', err);
    }

    const badgeEl = document.getElementById('status-badge');
    const badgeTextEl = document.getElementById('badge-text');
    const splashExitBtn = document.getElementById('splash-exit-btn');
    if (splashExitBtn) {
      splashExitBtn.addEventListener('click', () => {
        try {
          if (ipcRenderer) {
            ipcRenderer.send('splash-cancel-exit');
          }
        } catch (err) {
          console.error('[Splash] Failed to send splash-cancel-exit', err);
        }
      });
    }
    const titleEl = document.getElementById('status-title');
    const percentEl = document.getElementById('percent-readout');
    const progressEl = document.getElementById('progress-bar');
    const narrativeEl = document.getElementById('status-narrative');
    
    const metricLabel1 = document.getElementById('metric-label-1');
    const metricVal1 = document.getElementById('metric-val-1');
    const metricLabel2 = document.getElementById('metric-label-2');
    const metricVal2 = document.getElementById('metric-val-2');
    const metricLabel3 = document.getElementById('metric-label-3');
    const metricVal3 = document.getElementById('metric-val-3');
    const securityTag = document.getElementById('security-tag');

    // Default rotation messages when not actively downloading an update
    const auditSteps = [
      "Verifying core system integrity...",
      "Auditing background processes and active displays...",
      "Validating display topology and capture protection...",
      "Connecting to secure assessment gateway...",
      "Synchronizing diagnostic policies..."
    ];
    let stepIndex = 0;
    let isLiveUpdating = false;

    const auditInterval = setInterval(() => {
      if (isLiveUpdating) return;
      stepIndex = (stepIndex + 1) % auditSteps.length;
      narrativeEl.style.opacity = '0';
      setTimeout(() => {
        if (!isLiveUpdating) {
          narrativeEl.textContent = auditSteps[stepIndex];
          narrativeEl.style.opacity = '1';
        }
      }, 150);
    }, 1100);

    /**
     * Called directly from Electron's main process when auto-updater status changes.
     * @param {Object} data - UpdateStatus payload
     */
    window.onUpdateStatus = function(data) {
      if (!data) return;

      if (data.status === 'checking') {
        badgeTextEl.textContent = 'CHECKING UPDATES';
        narrativeEl.textContent = 'Checking Cloudflare distribution channel for updates...';
      } 
      else if (data.status === 'available') {
        isLiveUpdating = true;
        badgeEl.className = 'badge updating';
        badgeTextEl.textContent = 'UPDATING ENGINE';
        titleEl.textContent = 'Downloading Platform Update v' + (data.version || '');
        narrativeEl.textContent = 'Fetching cryptographic package from edge repository. Do not close app.';
        securityTag.textContent = 'SHA-256 Verified';

        metricLabel1.textContent = 'Download Speed';
        metricVal1.textContent = 'Connecting...';
        metricLabel2.textContent = 'Transferred';
        metricVal2.textContent = 'Initiating...';
        metricLabel3.textContent = 'Est. Time';
        metricVal3.textContent = 'Calculating...';

        progressEl.classList.remove('indeterminate');
        progressEl.style.width = '0%';
        percentEl.textContent = '0.0%';
      }
      else if (data.status === 'downloading') {
        isLiveUpdating = true;
        badgeEl.className = 'badge updating';
        badgeTextEl.textContent = 'UPDATING ENGINE';
        titleEl.textContent = 'Downloading Platform Update' + (data.version ? ' v' + data.version : '');
        narrativeEl.textContent = 'Downloading delta package. Do not terminate process or close lid.';

        const pct = typeof data.percent === 'number' ? data.percent : 0;
        progressEl.classList.remove('indeterminate');
        progressEl.style.width = pct.toFixed(1) + '%';
        percentEl.textContent = pct.toFixed(1) + '%';

        metricLabel1.textContent = 'Download Speed';
        metricVal1.textContent = data.speed || '0.00 MB/s';

        metricLabel2.textContent = 'Transferred';
        if (data.transferred && data.total) {
          const transMB = (data.transferred / (1024 * 1024)).toFixed(1);
          const totalMB = (data.total / (1024 * 1024)).toFixed(1);
          metricVal2.textContent = transMB + ' / ' + totalMB + ' MB';
        } else {
          metricVal2.textContent = pct.toFixed(0) + '%';
        }

        metricLabel3.textContent = 'Est. Time';
        metricVal3.textContent = data.etaString || (data.etaSeconds ? '~' + data.etaSeconds + 's' : 'Calculating...');
      }
      else if (data.status === 'downloaded') {
        isLiveUpdating = true;
        badgeEl.className = 'badge complete';
        badgeTextEl.textContent = 'UPDATE READY';
        titleEl.textContent = 'Update v' + (data.version || '') + ' Downloaded';
        narrativeEl.textContent = 'Validating package integrity. Restarting client automatically in 2s...';
        
        progressEl.classList.remove('indeterminate');
        progressEl.style.width = '100%';
        percentEl.textContent = '100%';

        metricLabel1.textContent = 'Status';
        metricVal1.textContent = 'Verified';
        metricLabel2.textContent = 'Action';
        metricVal2.textContent = 'Relaunching';
        metricLabel3.textContent = 'Time';
        metricVal3.textContent = 'Immediate';
      }
      else if (data.status === 'not-available') {
        badgeTextEl.textContent = 'UP TO DATE';
        titleEl.textContent = 'Software Up to Date';
        narrativeEl.textContent = 'Version verified. Launching secure exam environment...';
      }
      else if (data.status === 'error') {
        badgeTextEl.textContent = 'OFFLINE';
        narrativeEl.textContent = 'Unable to reach update server. Proceeding in offline mode...';
      }
    };
  </script>
</body>
</html>
