<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureBrowser Native HUD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    #hud-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: 40px;
      padding: 0 12px;
      margin: 2px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55), 0 0 1px rgba(255, 255, 255, 0.2);
    }

    /* ─── Latency / Wi-Fi Segment ─── */
    .hud-segment {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border-radius: 12px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--wifi-color, #22c55e);
      box-shadow: 0 0 0 0 var(--wifi-color, #22c55e);
      animation: pulse-ring 2.2s ease-out infinite;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70%  { box-shadow: 0 0 0 6px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .wifi-bars {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 12px;
    }

    .wifi-bar {
      width: 2.5px;
      border-radius: 1px;
      background: rgba(255, 255, 255, 0.2);
      transition: background 0.3s ease;
    }

    .wifi-bar:nth-child(1) { height: 3.5px; }
    .wifi-bar:nth-child(2) { height: 6px; }
    .wifi-bar:nth-child(3) { height: 8.5px; }
    .wifi-bar:nth-child(4) { height: 11px; }
    .wifi-bar.active { background: var(--wifi-color, #22c55e); }

    #ping-label {
      font-size: 11px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--wifi-color, #22c55e);
      letter-spacing: -0.02em;
      min-width: 48px;
    }

    /* ─── Divider ─── */
    .hud-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* ─── Battery Segment ─── */
    .battery-container {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #94a3b8;
    }

    .battery-icon-wrapper {
      position: relative;
      width: 20px;
      height: 11px;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 3px;
      padding: 1px;
      display: flex;
      align-items: center;
    }

    .battery-icon-wrapper::after {
      content: '';
      position: absolute;
      right: -3.5px;
      top: 2.5px;
      width: 2px;
      height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 0 1px 1px 0;
    }

    .battery-level-fill {
      height: 100%;
      width: 75%;
      background: #22c55e;
      border-radius: 1px;
      transition: width 0.4s ease, background 0.4s ease;
    }

    .charge-bolt {
      display: none;
      width: 10px;
      height: 10px;
      color: #facc15;
    }

    .charging .charge-bolt {
      display: inline-block;
    }

    #battery-label {
      font-size: 11px;
      font-weight: 600;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }

    /* ─── Native Exit App Button ─── */
    #close-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      padding: 0 10px;
      border-radius: 13px;
      border: 1px solid rgba(239, 68, 68, 0.5);
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      outline: none;
      -webkit-app-region: no-drag;
    }

    #close-btn:hover {
      background: #dc2626;
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    #close-btn:active {
      transform: scale(0.96);
    }

    #close-btn svg {
      width: 12px;
      height: 12px;
      stroke-width: 2.4;
      stroke: currentColor;
    }
  </style>
</head>
<body>
  <div id="hud-pill">
    <!-- Latency / Wi-Fi -->
    <div class="hud-segment" title="Network Ping to Server">
      <div class="pulse-dot" id="pulse"></div>
      <div class="wifi-bars" id="wifi-bars">
        <div class="wifi-bar" id="b1"></div>
        <div class="wifi-bar" id="b2"></div>
        <div class="wifi-bar" id="b3"></div>
        <div class="wifi-bar" id="b4"></div>
      </div>
      <span id="ping-label">… ms</span>
    </div>

    <div class="hud-divider"></div>

    <!-- Battery -->
    <div class="hud-segment battery-container" id="battery-box" title="System Battery Level">
      <svg class="charge-bolt" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      <div class="battery-icon-wrapper">
        <div class="battery-level-fill" id="bat-fill"></div>
      </div>
      <span id="battery-label">100%</span>
    </div>

    <div class="hud-divider"></div>

    <!-- Exit App -->
    <button id="close-btn" title="Exit Assessment / Quit Secure Browser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
      <span>Exit App</span>
    </button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const pingLabel   = document.getElementById('ping-label');
    const pulseEl     = document.getElementById('pulse');
    const bars        = [
      document.getElementById('b1'),
      document.getElementById('b2'),
      document.getElementById('b3'),
      document.getElementById('b4'),
    ];
    const batFill     = document.getElementById('bat-fill');
    const batLabel    = document.getElementById('battery-label');
    const batBox      = document.getElementById('battery-box');
    const closeBtn    = document.getElementById('close-btn');

    // ── 1. Latency Tripartite Quality ──
    function applyQuality(ms) {
      let color, activeBars, label;

      if (ms === null || ms === undefined) {
        color = '#ef4444';
        activeBars = 0;
        label = 'Offline';
      } else if (ms < 400) {
        color = '#22c55e'; // Emerald Green
        activeBars = 4;
        label = `${ms} ms`;
      } else if (ms < 999) {
        color = '#f59e0b'; // Amber
        activeBars = 2;
        label = `${ms} ms`;
      } else {
        color = '#ef4444'; // Crimson Red
        activeBars = 1;
        label = '999+ ms';
      }

      document.documentElement.style.setProperty('--wifi-color', color);
      pingLabel.style.color = color;
      pulseEl.style.background = color;

      bars.forEach((bar, i) => {
        if (i < activeBars) {
          bar.classList.add('active');
        } else {
          bar.classList.remove('active');
        }
      });

      pingLabel.textContent = label;
    }

    ipcRenderer.on('wifi-status', (_event, data) => {
      applyQuality(data.ms);
    });

    // ── 2. Native Battery Level Monitor ──
    async function initBattery() {
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          const update = () => {
            const level = Math.round(battery.level * 100);
            batLabel.textContent = `${level}%`;
            batFill.style.width = `${level}%`;

            if (battery.charging) {
              batBox.classList.add('charging');
              batFill.style.background = '#22c55e';
            } else {
              batBox.classList.remove('charging');
              if (level <= 15) {
                batFill.style.background = '#ef4444';
              } else if (level <= 30) {
                batFill.style.background = '#f59e0b';
              } else {
                batFill.style.background = '#22c55e';
              }
            }
          };

          update();
          battery.addEventListener('levelchange', update);
          battery.addEventListener('chargingchange', update);
        } else {
          batLabel.textContent = 'PWR';
          batFill.style.width = '100%';
        }
      } catch (err) {
        console.warn('Battery API not available:', err);
        batBox.style.display = 'none';
      }
    }
    initBattery();

    // ── 3. Close Button ──
    closeBtn.addEventListener('click', () => {
      ipcRenderer.send('overlay-request-close');
    });
  </script>
</body>
</html>
