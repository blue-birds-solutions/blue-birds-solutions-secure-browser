<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureBrowser Native HUD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    #hud-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: 40px;
      padding: 0 14px;
      margin: 2px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
      color: #0f172a;
    }

    /* ─── Latency / Wi-Fi Segment ─── */
    .hud-segment {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 4px;
      border-radius: 12px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--wifi-color, #10b981);
      box-shadow: 0 0 0 0 var(--wifi-color, #10b981);
      animation: pulse-ring 2.2s ease-out infinite;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70%  { box-shadow: 0 0 0 6px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .wifi-bars {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 13px;
    }

    .wifi-bar {
      width: 2.5px;
      border-radius: 1px;
      background: #cbd5e1;
      transition: background 0.3s ease;
    }

    .wifi-bar:nth-child(1) { height: 4px; }
    .wifi-bar:nth-child(2) { height: 7px; }
    .wifi-bar:nth-child(3) { height: 10px; }
    .wifi-bar:nth-child(4) { height: 13px; }
    .wifi-bar.active { background: var(--wifi-color, #10b981); }

    /* ─── Divider ─── */
    .hud-divider {
      width: 1px;
      height: 16px;
      background: #e2e8f0;
    }

    /* ─── Remaining Time Segment ─── */
    .timer-container {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #334155;
      font-weight: 600;
      font-size: 11.5px;
    }

    .timer-container svg {
      width: 13px;
      height: 13px;
      color: #64748b;
    }

    #remaining-timer-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.02em;
    }

    /* ─── Battery Segment ─── */
    .battery-container {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #475569;
    }

    .battery-icon-wrapper {
      position: relative;
      width: 20px;
      height: 11px;
      border: 1.5px solid #94a3b8;
      border-radius: 3px;
      padding: 1px;
      display: flex;
      align-items: center;
    }

    .battery-icon-wrapper::after {
      content: '';
      position: absolute;
      right: -3.5px;
      top: 2.5px;
      width: 2px;
      height: 4px;
      background: #94a3b8;
      border-radius: 0 1px 1px 0;
    }

    .battery-level-fill {
      height: 100%;
      width: 75%;
      background: #10b981;
      border-radius: 1px;
      transition: width 0.4s ease, background 0.4s ease;
    }

    .charge-bolt {
      display: none;
      width: 10px;
      height: 10px;
      color: #d97706;
    }

    .charging .charge-bolt {
      display: inline-block;
    }

    #battery-label {
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }

    /* ─── Native Exit App Button ─── */
    #close-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      padding: 0 10px;
      border-radius: 13px;
      border: 1px solid rgba(239, 68, 68, 0.4);
      background: #fef2f2;
      color: #dc2626;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      outline: none;
      -webkit-app-region: no-drag;
    }

    #close-btn:hover {
      background: #dc2626;
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.35);
    }

    #close-btn:active {
      transform: scale(0.96);
    }

    #close-btn svg {
      width: 12px;
      height: 12px;
      stroke-width: 2.4;
      stroke: currentColor;
    }
  </style>
</head>
<body>
  <div id="hud-pill">
    <!-- Latency / Wi-Fi (Clean symbol without ms text) -->
    <div class="hud-segment" id="wifi-segment" title="Network Status: Connected">
      <div class="pulse-dot" id="pulse"></div>
      <div class="wifi-bars" id="wifi-bars">
        <div class="wifi-bar" id="b1"></div>
        <div class="wifi-bar" id="b2"></div>
        <div class="wifi-bar" id="b3"></div>
        <div class="wifi-bar" id="b4"></div>
      </div>
    </div>

    <div class="hud-divider"></div>

    <!-- Exam Remaining Time -->
    <div class="hud-segment timer-container" id="remaining-timer-box" title="Exam Remaining Time">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span style="color:#64748b; font-size:10.5px; font-weight:600;">Remaining:</span>
      <span id="remaining-timer-val">--:--</span>
    </div>

    <div class="hud-divider"></div>

    <!-- Battery -->
    <div class="hud-segment battery-container" id="battery-box" title="System Battery Level">
      <svg class="charge-bolt" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      <div class="battery-icon-wrapper">
        <div class="battery-level-fill" id="bat-fill"></div>
      </div>
      <span id="battery-label">100%</span>
    </div>

    <div class="hud-divider"></div>

    <!-- Exit App -->
    <button id="close-btn" title="Exit Assessment / Quit Secure Browser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
      <span>Exit App</span>
    </button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const pulseEl       = document.getElementById('pulse');
    const wifiSegment   = document.getElementById('wifi-segment');
    const bars          = [
      document.getElementById('b1'),
      document.getElementById('b2'),
      document.getElementById('b3'),
      document.getElementById('b4'),
    ];
    const batFill       = document.getElementById('bat-fill');
    const batLabel      = document.getElementById('battery-label');
    const batBox        = document.getElementById('battery-box');
    const closeBtn      = document.getElementById('close-btn');
    const timerVal      = document.getElementById('remaining-timer-val');

    // ── 1. Latency Tripartite Quality (Green / Amber / Red WiFi Symbol) ──
    function applyQuality(ms) {
      let color, activeBars, tooltip;

      if (ms === null || ms === undefined) {
        color = '#ef4444'; // Red
        activeBars = 0;
        tooltip = 'Network: Disconnected / Offline';
      } else if (ms < 400) {
        color = '#10b981'; // Green (Healthy)
        activeBars = 4;
        tooltip = 'Network: Excellent';
      } else if (ms < 999) {
        color = '#f59e0b'; // Amber (Moderate)
        activeBars = 2;
        tooltip = 'Network: Moderate Latency';
      } else {
        color = '#ef4444'; // Red (High Latency)
        activeBars = 1;
        tooltip = 'Network: High Latency';
      }

      document.documentElement.style.setProperty('--wifi-color', color);
      pulseEl.style.background = color;
      wifiSegment.setAttribute('title', tooltip);

      bars.forEach((bar, i) => {
        if (i < activeBars) {
          bar.classList.add('active');
        } else {
          bar.classList.remove('active');
        }
      });
    }

    ipcRenderer.on('wifi-status', (_event, data) => {
      applyQuality(data.ms);
    });

    ipcRenderer.on('exam-timer-sync', (_event, data) => {
      if (data && data.text && timerVal) {
        timerVal.textContent = data.text;
      }
    });

    // ── 2. Native Battery Level Monitor ──
    async function initBattery() {
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          const update = () => {
            const level = Math.round(battery.level * 100);
            batLabel.textContent = `${level}%`;
            batFill.style.width = `${level}%`;

            if (battery.charging) {
              batBox.classList.add('charging');
              batFill.style.background = '#10b981';
            } else {
              batBox.classList.remove('charging');
              if (level <= 15) {
                batFill.style.background = '#ef4444';
              } else if (level <= 30) {
                batFill.style.background = '#f59e0b';
              } else {
                batFill.style.background = '#10b981';
              }
            }
          };

          update();
          battery.addEventListener('levelchange', update);
          battery.addEventListener('chargingchange', update);
        } else {
          batLabel.textContent = 'PWR';
          batFill.style.width = '100%';
        }
      } catch (err) {
        console.warn('Battery API not available:', err);
        batBox.style.display = 'none';
      }
    }
    initBattery();

    // ── 3. Close Button ──
    closeBtn.addEventListener('click', () => {
      ipcRenderer.send('overlay-request-close');
    });
  </script>
</body>
</html>
