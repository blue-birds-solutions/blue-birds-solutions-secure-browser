<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureBrowser Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 44px;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    #bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 18px;
      background: rgba(10, 14, 23, 0.96);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    /* Left — Brand lock badge */
    .left {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: drag;
    }

    .lock-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
    }

    .lock-icon {
      width: 13px;
      height: 13px;
      color: #38bdf8;
      flex-shrink: 0;
    }

    .brand {
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    /* Center — WiFi status */
    .center {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 6px;
      -webkit-app-region: drag;
    }

    .wifi-icon {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .wifi-bar {
      width: 3px;
      border-radius: 1.5px;
      background: rgba(255, 255, 255, 0.2);
      transition: background 0.3s ease, height 0.3s ease;
    }

    .wifi-bar:nth-child(1) { height: 4px; }
    .wifi-bar:nth-child(2) { height: 7px; }
    .wifi-bar:nth-child(3) { height: 10px; }
    .wifi-bar:nth-child(4) { height: 13px; }

    .wifi-bar.active { background: var(--wifi-color, #22c55e); }

    #ping-label {
      font-size: 11.5px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--wifi-color, #22c55e);
      min-width: 68px;
      text-align: left;
      transition: color 0.3s ease;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--wifi-color, #22c55e);
      box-shadow: 0 0 0 0 var(--wifi-color, #22c55e);
      animation: pulse-ring 2.2s ease-out infinite;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70%  { box-shadow: 0 0 0 7px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    /* Right — Clean, Professional Exit Button */
    .right {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    #close-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      outline: none;
    }

    #close-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: #ffffff;
    }

    #close-btn:active {
      transform: scale(0.97);
    }

    #close-btn svg {
      width: 13px;
      height: 13px;
      stroke-width: 2.2;
      stroke: currentColor;
    }

    /* Offline State */
    body.offline #bar {
      background: rgba(28, 10, 10, 0.98);
      border-bottom-color: rgba(239, 68, 68, 0.35);
    }
  </style>
</head>
<body>
  <div id="bar">
    <!-- Left: Lock Badge & Brand -->
    <div class="left">
      <div class="lock-badge">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span class="brand">Secure Exam Session</span>
      </div>
      <div class="live-dot" title="Proctoring Lockdown Active"></div>
    </div>

    <!-- Center: Network Latency / Wi-Fi -->
    <div class="center">
      <div class="pulse-dot" id="pulse"></div>
      <div class="wifi-icon" id="wifi-icon">
        <div class="wifi-bar" id="b1"></div>
        <div class="wifi-bar" id="b2"></div>
        <div class="wifi-bar" id="b3"></div>
        <div class="wifi-bar" id="b4"></div>
      </div>
      <span id="ping-label">Checking…</span>
    </div>

    <!-- Right: High-Visibility Close Button -->
    <div class="right">
      <button id="close-btn" title="Exit Assessment / Close Application">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        <span>Exit Browser</span>
      </button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const pingLabel    = document.getElementById('ping-label');
    const pulseEl      = document.getElementById('pulse');
    const bars         = [
      document.getElementById('b1'),
      document.getElementById('b2'),
      document.getElementById('b3'),
      document.getElementById('b4'),
    ];
    const closeBtn     = document.getElementById('close-btn');
    const body         = document.body;

    // WiFi quality thresholds
    function applyQuality(ms) {
      let color, activeBars, label;

      if (ms === null) {
        color = '#ef4444';
        activeBars = 0;
        label = '● Disconnected';
        body.classList.add('offline');
      } else {
        body.classList.remove('offline');
        if (ms < 400) {
          color = '#22c55e';
          activeBars = 4;
          label = `${ms} ms`;
        } else if (ms < 999) {
          color = '#f59e0b';
          activeBars = 2;
          label = `${ms} ms`;
        } else {
          color = '#ef4444';
          activeBars = 1;
          label = '999+ ms';
        }
      }

      document.documentElement.style.setProperty('--wifi-color', color);
      pingLabel.style.color = color;
      pulseEl.style.background = color;

      bars.forEach((bar, i) => {
        if (i < activeBars) {
          bar.classList.add('active');
        } else {
          bar.classList.remove('active');
        }
      });

      pingLabel.textContent = label;
    }

    // Listen for wifi status from main process
    ipcRenderer.on('wifi-status', (_event, data) => {
      applyQuality(data.ms);
    });

    // Close button — ask main process to show confirm dialog
    closeBtn.addEventListener('click', () => {
      ipcRenderer.send('overlay-request-close');
    });
  </script>
</body>
</html>
